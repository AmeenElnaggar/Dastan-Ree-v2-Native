<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senior Property Consultant — Dastan Real Estate</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../src/assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../../src/styles/variables.css" />
    <link rel="stylesheet" href="../../../src/styles/global.css" />
    <link rel="stylesheet" href="../../../src/styles/utilities.css" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/navbar/navbar.css" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/footer/footer.css" />

    <link rel="stylesheet" href="career-details.css" />
    <script>
      history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../../tailwind.config.js"></script>
  </head>
  <body class="font-sans bg-gray-50 text-gray-900">
    <!-- Navbar -->
    <div id="navbar-root"></div>

    <!-- Job Header -->
    <header class="job-header pt-32 pb-16 bg-white border-b border-gray-200">
      <div class="max-w-5xl mx-auto px-6">
        <a
          href="../careers/index.html"
          class="back-link mb-6 inline-flex items-center text-sm font-semibold uppercase tracking-wider text-gray-500 hover:text-[#0a1e77] transition-colors">
          <i class="fa-solid fa-arrow-left mr-2"></i> Back to Careers
        </a>

        <div
          class="flex flex-col md:flex-row md:items-end justify-between gap-6 fade-up">
          <div>
            <h1
              id="jd-title"
              class="font-playfair text-4xl md:text-5xl font-bold text-[#0a1e77] mb-4">
              Senior Property Consultant
            </h1>
            <div
              id="jd-meta"
              class="flex flex-wrap gap-4 text-gray-600 font-medium"></div>
          </div>
          <div>
            <button
              class="apply-scroll-btn bg-[#0a1e77] text-white px-8 py-3 rounded-full font-bold uppercase tracking-wider hover:bg-[#08175e] hover:shadow-lg transition-all transform"
              onclick="
                document
                  .getElementById('apply-section')
                  .scrollIntoView({ behavior: 'smooth' })
              ">
              Apply For This Role
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Grid -->
    <div
      class="max-w-5xl mx-auto px-6 py-16 grid grid-cols-1 lg:grid-cols-3 gap-12">
      <!-- Left Column: Job Description -->
      <main
        class="lg:col-span-2 space-y-10 fade-up"
        style="transition-delay: 0.1s">
        <section class="job-section">
          <h2
            class="text-2xl font-bold text-gray-900 mb-4 font-playfair border-b-2 border-[var(--color-gold-accent)] inline-block pb-2">
            About the Role
          </h2>
          <p class="text-gray-600 leading-relaxed" id="jd-about"></p>
        </section>

        <section class="job-section">
          <h2
            class="text-2xl font-bold text-gray-900 mb-4 font-playfair border-b-2 border-[var(--color-gold-accent)] inline-block pb-2">
            Key Responsibilities
          </h2>
          <ul class="list-none space-y-3" id="jd-responsibilities"></ul>
        </section>

        <section class="job-section">
          <h2
            class="text-2xl font-bold text-gray-900 mb-4 font-playfair border-b-2 border-[var(--color-gold-accent)] inline-block pb-2">
            Requirements
          </h2>
          <ul class="list-none space-y-3" id="jd-requirements"></ul>
        </section>

        <section class="job-section">
          <h2
            class="text-2xl font-bold text-gray-900 mb-4 font-playfair border-b-2 border-[var(--color-gold-accent)] inline-block pb-2">
            Benefits
          </h2>
          <p class="text-gray-600 leading-relaxed mb-4">
            We believe in rewarding our top performers. Joining Dastan means
            you'll enjoy:
          </p>
          <div
            class="grid grid-cols-1 sm:grid-cols-2 gap-4"
            id="jd-benefits"></div>
        </section>
      </main>

      <!-- Right Column: Application Form -->
      <aside
        class="lg:col-span-1 fade-up"
        style="transition-delay: 0.2s"
        id="apply-section">
        <div
          class="bg-white p-8 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.06)] border border-gray-100 sticky top-28">
          <h3 class="text-2xl font-playfair font-bold text-[#0a1e77] mb-2">
            Apply Now
          </h3>
          <p
            class="text-sm text-gray-500 mb-6 border-b border-gray-100 pb-4"
            id="jd-form-subtitle">
            Submit your application
          </p>

          <form id="applicationForm" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Full Name <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                required
                class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-md focus:ring-2 focus:ring-[#0a1e77] focus:border-transparent outline-none transition-all text-sm"
                placeholder="John Doe" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Email Address <span class="text-red-500">*</span></label
              >
              <input
                type="email"
                required
                class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-md focus:ring-2 focus:ring-[#0a1e77] focus:border-transparent outline-none transition-all text-sm"
                placeholder="john@example.com" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Phone Number <span class="text-red-500">*</span></label
              >
              <input
                type="tel"
                required
                class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-md focus:ring-2 focus:ring-[#0a1e77] focus:border-transparent outline-none transition-all text-sm"
                placeholder="+971 50 000 0000" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >LinkedIn Profile</label
              >
              <input
                type="url"
                class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-md focus:ring-2 focus:ring-[#0a1e77] focus:border-transparent outline-none transition-all text-sm"
                placeholder="https://linkedin.com/in/username" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Resume / CV <span class="text-red-500">*</span></label
              >
              <div
                class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md hover:border-[var(--color-gold-accent)] transition-colors group cursor-pointer relative bg-gray-50"
                id="drop-zone">
                <div class="space-y-1 text-center">
                  <i
                    class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 group-hover:text-[var(--color-gold-accent)] mb-2"></i>
                  <div class="flex text-sm text-gray-600 justify-center">
                    <label
                      for="file-upload"
                      class="relative cursor-pointer bg-transparent rounded-md font-medium text-[#0a1e77] hover:text-[var(--color-gold-accent)] focus-within:outline-none">
                      <span>Upload a file</span>
                      <input
                        id="file-upload"
                        name="file-upload"
                        type="file"
                        class="sr-only"
                        required
                        accept=".pdf,.doc,.docx" />
                    </label>
                    <p class="pl-1">or drag and drop</p>
                  </div>
                  <p class="text-xs text-gray-500" id="file-name-display">
                    PDF, DOC up to 5MB
                  </p>
                </div>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Cover Letter (Optional)</label
              >
              <textarea
                rows="3"
                class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-md focus:ring-2 focus:ring-[#0a1e77] focus:border-transparent outline-none transition-all text-sm resize-none"
                placeholder="Briefly tell us why you're a good fit..."></textarea>
            </div>

            <button
              type="submit"
              class="w-full bg-[#0a1e77] text-white py-3 rounded-md font-bold uppercase tracking-wider hover:bg-[#08175e] transition-colors flex items-center justify-center gap-2">
              <span>Submit Application</span>
              <i class="fa-solid fa-paper-plane"></i>
            </button>
            <div
              id="form-message"
              class="hidden mt-4 p-3 rounded text-sm text-center"></div>
          </form>
        </div>
      </aside>
    </div>

    <!-- Footer -->
    <div id="footer-root"></div>

    <!-- Scripts -->
    <script
      type="module"
      src="../../../src/shared/components/navbar/Navbar.js"></script>
    <script
      type="module"
      src="../../../src/shared/components/footer/Footer.js"></script>
    <script type="module" src="career-details.js"></script>
  </body>
</html>
