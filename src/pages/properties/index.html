<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Properties — Dastan Real Estate</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../src/assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../../src/styles/variables.css" />
    <link rel="stylesheet" href="../../../src/styles/global.css" />
    <link rel="stylesheet" href="../../../src/styles/utilities.css" />
    <link rel="stylesheet" href="../../../src/shared/components/navbar/navbar.css" />
    <link rel="stylesheet" href="../../../src/shared/components/footer/footer.css" />
    <link rel="stylesheet" href="../../../src/shared/components/property-card/property-card.css" />
    <link rel="stylesheet" href="../../../src/shared/components/action-link/action-link.css" />
    <link rel="stylesheet" href="../../../src/shared/components/filter-banner/filter-banner.css" />
    <link rel="stylesheet" href="properties.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../../tailwind.config.js"></script>
  </head>
  <body class="font-sans bg-white text-gray-900">
    <div id="navbar-root"></div>
    <div id="page-header-root"></div>
    <div id="filter-banner-root"></div>

    <!-- Properties Section -->
    <section class="properties-section">
      <div class="properties-section__container">
        <div class="properties-layout">

          <!-- Filters Sidebar -->
          <aside class="filters-sidebar" id="filtersSidebar" aria-label="Advanced filters">
            <div class="filters-sidebar__header">
              <h2 class="filters-sidebar__title">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                </svg>
                Refine Results
              </h2>
              <button class="filters-sidebar__clear-all" id="clearAllFilters">Clear All</button>
            </div>

            <!-- Purpose -->
            <div class="filter-section" data-section="purpose">
              <button class="filter-section__toggle" aria-expanded="true">
                Purpose
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body">
                <label class="filter-check"><input type="checkbox" name="purpose" value="sale" class="adv-filter"/><span class="filter-check__box"></span>For Sale</label>
                <label class="filter-check"><input type="checkbox" name="purpose" value="rent" class="adv-filter"/><span class="filter-check__box"></span>For Rent</label>
              </div>
            </div>

            <!-- Property Type -->
            <div class="filter-section" data-section="type">
              <button class="filter-section__toggle" aria-expanded="true">
                Property Type
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body">
                <label class="filter-check"><input type="checkbox" name="type" value="Apartment" class="adv-filter"/><span class="filter-check__box"></span>Apartment</label>
                <label class="filter-check"><input type="checkbox" name="type" value="Villa" class="adv-filter"/><span class="filter-check__box"></span>Villa</label>
                <label class="filter-check"><input type="checkbox" name="type" value="Townhouse" class="adv-filter"/><span class="filter-check__box"></span>Townhouse</label>
                <label class="filter-check"><input type="checkbox" name="type" value="Penthouse" class="adv-filter"/><span class="filter-check__box"></span>Penthouse</label>
                <label class="filter-check"><input type="checkbox" name="type" value="Duplex" class="adv-filter"/><span class="filter-check__box"></span>Duplex</label>
              </div>
            </div>

            <!-- Bedrooms -->
            <div class="filter-section" data-section="beds">
              <button class="filter-section__toggle" aria-expanded="true">
                Bedrooms
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body">
                <div class="filter-pills" id="bedsPills" data-filter="beds" data-multi="true">
                  <button class="filter-pill" data-value="0" type="button">Studio</button>
                  <button class="filter-pill" data-value="1" type="button">1</button>
                  <button class="filter-pill" data-value="2" type="button">2</button>
                  <button class="filter-pill" data-value="3" type="button">3</button>
                  <button class="filter-pill" data-value="4" type="button">4</button>
                  <button class="filter-pill" data-value="5" type="button">5+</button>
                </div>
              </div>
            </div>

            <!-- Bathrooms -->
            <div class="filter-section" data-section="baths">
              <button class="filter-section__toggle" aria-expanded="true">
                Bathrooms
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body">
                <div class="filter-pills" id="bathsPills" data-filter="baths" data-multi="true">
                  <button class="filter-pill" data-value="1" type="button">1</button>
                  <button class="filter-pill" data-value="2" type="button">2</button>
                  <button class="filter-pill" data-value="3" type="button">3</button>
                  <button class="filter-pill" data-value="4" type="button">4+</button>
                </div>
              </div>
            </div>

            <!-- Price Range -->
            <div class="filter-section" data-section="price">
              <button class="filter-section__toggle" aria-expanded="true">
                Price Range (EGP)
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body">
                <div class="filter-range">
                  <input type="number" class="filter-range__input" id="priceMin" placeholder="Min" min="0"/>
                  <span class="filter-range__sep">—</span>
                  <input type="number" class="filter-range__input" id="priceMax" placeholder="Max" min="0"/>
                </div>
              </div>
            </div>

            <!-- Area Size -->
            <div class="filter-section" data-section="area">
              <button class="filter-section__toggle" aria-expanded="false">
                Area Size (sqm)
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body filter-section__body--collapsed">
                <div class="filter-range">
                  <input type="number" class="filter-range__input" id="areaMin" placeholder="Min sqm" min="0"/>
                  <span class="filter-range__sep">—</span>
                  <input type="number" class="filter-range__input" id="areaMax" placeholder="Max sqm" min="0"/>
                </div>
              </div>
            </div>

            <!-- Community -->
            <div class="filter-section" data-section="community">
              <button class="filter-section__toggle" aria-expanded="false">
                Community
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body filter-section__body--collapsed">
                <label class="filter-check"><input type="checkbox" name="community" value="new-cairo" class="adv-filter"/><span class="filter-check__box"></span>New Cairo</label>
                <label class="filter-check"><input type="checkbox" name="community" value="new-capital" class="adv-filter"/><span class="filter-check__box"></span>New Administrative Capital</label>
                <label class="filter-check"><input type="checkbox" name="community" value="north-coast" class="adv-filter"/><span class="filter-check__box"></span>North Coast</label>
                <label class="filter-check"><input type="checkbox" name="community" value="red-sea" class="adv-filter"/><span class="filter-check__box"></span>Red Sea Coast</label>
                <label class="filter-check"><input type="checkbox" name="community" value="west-cairo" class="adv-filter"/><span class="filter-check__box"></span>West Cairo</label>
                <label class="filter-check"><input type="checkbox" name="community" value="cairo-center" class="adv-filter"/><span class="filter-check__box"></span>Cairo Centre</label>
              </div>
            </div>

            <!-- Availability -->
            <div class="filter-section" data-section="status">
              <button class="filter-section__toggle" aria-expanded="false">
                Availability
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body filter-section__body--collapsed">
                <label class="filter-check"><input type="checkbox" name="status" value="Ready" class="adv-filter"/><span class="filter-check__box"></span>Ready to Move</label>
                <label class="filter-check"><input type="checkbox" name="status" value="Available" class="adv-filter"/><span class="filter-check__box"></span>Available</label>
                <label class="filter-check"><input type="checkbox" name="status" value="Limited Units" class="adv-filter"/><span class="filter-check__box"></span>Limited Units</label>
                <label class="filter-check"><input type="checkbox" name="status" value="Off-Plan" class="adv-filter"/><span class="filter-check__box"></span>Off-Plan</label>
                <label class="filter-check"><input type="checkbox" name="status" value="Under Construction" class="adv-filter"/><span class="filter-check__box"></span>Under Construction</label>
              </div>
            </div>

            <!-- Furnishing -->
            <div class="filter-section" data-section="furnishing">
              <button class="filter-section__toggle" aria-expanded="false">
                Furnishing
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body filter-section__body--collapsed">
                <div class="filter-pills filter-pills--col" id="furnishingPills" data-filter="furnishing" data-multi="false">
                  <button class="filter-pill" data-value="Fully Furnished" type="button">Fully Furnished</button>
                  <button class="filter-pill" data-value="Unfurnished" type="button">Unfurnished</button>
                  <button class="filter-pill" data-value="Semi-Furnished" type="button">Semi-Furnished</button>
                </div>
              </div>
            </div>

            <!-- Parking -->
            <div class="filter-section" data-section="parking">
              <button class="filter-section__toggle" aria-expanded="false">
                Parking
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body filter-section__body--collapsed">
                <label class="filter-toggle-switch">
                  <input type="checkbox" id="parkingFilter" class="adv-filter" data-filter="parking"/>
                  <span class="filter-toggle-switch__track">
                    <span class="filter-toggle-switch__thumb"></span>
                  </span>
                  <span class="filter-toggle-switch__label">Parking included</span>
                </label>
              </div>
            </div>

            <!-- Views -->
            <div class="filter-section" data-section="views">
              <button class="filter-section__toggle" aria-expanded="false">
                Views
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body filter-section__body--collapsed">
                <div class="filter-tags" id="viewsTags" data-filter="views">
                  <button class="filter-tag" data-value="sea" type="button">Sea View</button>
                  <button class="filter-tag" data-value="city" type="button">City View</button>
                  <button class="filter-tag" data-value="garden" type="button">Garden View</button>
                  <button class="filter-tag" data-value="pool" type="button">Pool View</button>
                  <button class="filter-tag" data-value="golf" type="button">Golf View</button>
                  <button class="filter-tag" data-value="canal" type="button">Canal View</button>
                </div>
              </div>
            </div>

            <!-- Amenities -->
            <div class="filter-section" data-section="amenities">
              <button class="filter-section__toggle" aria-expanded="false">
                Amenities
                <svg class="filter-section__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="filter-section__body filter-section__body--collapsed">
                <div class="filter-tags" id="amenitiesTags" data-filter="amenities">
                  <button class="filter-tag" data-value="pool" type="button">Pool</button>
                  <button class="filter-tag" data-value="gym" type="button">Gym</button>
                  <button class="filter-tag" data-value="parking" type="button">Parking</button>
                  <button class="filter-tag" data-value="security" type="button">Security</button>
                  <button class="filter-tag" data-value="beach" type="button">Beach</button>
                  <button class="filter-tag" data-value="garden" type="button">Garden</button>
                  <button class="filter-tag" data-value="concierge" type="button">Concierge</button>
                  <button class="filter-tag" data-value="spa" type="button">Spa</button>
                  <button class="filter-tag" data-value="kids" type="button">Kids Area</button>
                </div>
              </div>
            </div>
          </aside>

          <!-- Results Area -->
          <div class="properties-results">
            <div class="results-bar">
              <span class="results-bar__count" id="results-count"></span>
              <div class="results-bar__sort">
                <label class="results-bar__sort-label" for="sort-select">Sort by</label>
                <div class="results-bar__select-wrap">
                  <select id="sort-select" class="results-bar__select">
                    <option value="default">Default</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="area-asc">Area: Small to Large</option>
                  </select>
                  <svg class="results-bar__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
              </div>
            </div>

            <div class="active-filters" id="activeFilters" aria-live="polite"></div>

            <div id="properties-grid" class="properties-grid" role="list"></div>

            <div class="properties-empty" id="propertiesEmpty" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <h3>No properties found</h3>
              <p>Try adjusting your filters to see more results.</p>
              <button class="btn-reset" id="emptyResetBtn">Reset All Filters</button>
            </div>

            <nav class="pagination" id="pagination" aria-label="Properties pagination"></nav>
          </div>

        </div>
      </div>
    </section>

    <!-- Mobile Filters Button -->
    <button class="filters-mobile-btn" id="filtersMobileBtn" aria-label="Open filters" aria-expanded="false">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
      </svg>
      Filters
      <span class="filters-mobile-btn__badge" id="filtersBadge" hidden>0</span>
    </button>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <div id="footer-root"></div>

    <script type="module" src="../../../src/shared/components/navbar/Navbar.js"></script>
    <script type="module" src="../../../src/shared/components/footer/Footer.js"></script>
    <script type="module" src="properties.js"></script>
  </body>
</html>
