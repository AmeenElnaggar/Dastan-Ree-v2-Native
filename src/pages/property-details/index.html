<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Details — Dastan Real Estate</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../src/assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../../../src/styles/variables.css" />
    <link rel="stylesheet" href="../../../src/styles/global.css" />
    <link rel="stylesheet" href="../../../src/styles/utilities.css" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/navbar/navbar.css" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/footer/footer.css" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/modal/modal.css" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/property-card/property-card.css" />
    <link
      rel="stylesheet"
      href="property-details.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../../tailwind.config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body class="font-sans bg-white text-gray-900">
    <div id="navbar-root"></div>

    <!-- ── Intro Banner ────────────────────────────────────────────── -->
    <section class="pd-intro" id="pd-intro">
      <div class="pd-intro__inner">
        <span class="pd-intro__badge" id="intro-badge"></span>
        <div class="pd-intro__title-row">
          <img class="pd-intro__logo" id="intro-logo" src="" alt="" />
          <h1 class="pd-intro__title" id="intro-title"></h1>
        </div>
        <p class="pd-intro__desc" id="intro-desc"></p>
        <p class="pd-intro__location" id="intro-location"></p>
      </div>
    </section>

    <!-- ── Gallery (9 cols) + Quick Info (3 cols) ──────────────────── -->
    <section class="pd-gallery-info" id="pd-gallery-info">
      <div class="pd-gallery-info__inner">
        <div class="pd-gallery-info__gallery">
          <div class="swiper pd-gallery-main" id="gallery-main">
            <div class="swiper-wrapper" id="gallery-main-slides"></div>
            <button
              class="pd-gallery-main__nav pd-gallery-main__nav--prev"
              id="gallery-main-prev"
              type="button"
              aria-label="Previous image">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button
              class="pd-gallery-main__nav pd-gallery-main__nav--next"
              id="gallery-main-next"
              type="button"
              aria-label="Next image">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
          <div class="swiper pd-gallery-thumbs" id="gallery-thumbs">
            <div class="swiper-wrapper" id="gallery-thumb-slides"></div>
          </div>
        </div>
        <aside class="pd-gallery-info__quick">
          <div class="pd-quick-info" id="quick-info"></div>
        </aside>
      </div>
    </section>

    <!-- ── Sticky Summary Bar ─────────────────────────────────────── -->
    <div class="pd-sticky" id="pd-sticky" aria-hidden="true">
      <div class="pd-sticky__inner">
        <span class="pd-sticky__name" id="sticky-name"></span>
        <span class="pd-sticky__sep" aria-hidden="true">·</span>
        <span class="pd-sticky__price" id="sticky-price"></span>
        <button class="pd-sticky__cta" id="sticky-schedule-btn">
          Schedule a Viewing
        </button>
      </div>
    </div>

    <!-- ── Body: Main Column + Sidebar ───────────────────────────── -->
    <div class="pd-body">
      <div class="pd-body__inner">
        <!-- Main Column -->
        <main class="pd-main-col">
          <!-- About -->
          <section class="pd-section" id="about-section">
            <h2 class="pd-section-title">About This Property</h2>
            <div class="pd-about-body">
              <div class="pd-about__main">
                <p class="pd-about__text is-clamped" id="about-text"></p>
                <button
                  class="pd-about__readmore"
                  id="about-readmore"
                  type="button"
                  aria-expanded="false"
                  hidden>
                  <span class="pd-about__readmore-label">Read More</span>
                  <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>
              </div>
              <div class="pd-developer-card" id="developer-card"></div>
            </div>
          </section>

          <!-- Amenities -->
          <section class="pd-section" id="amenities-section">
            <h2 class="pd-section-title">Amenities &amp; Features</h2>
            <div class="pd-amenities-grid" id="amenities-grid"></div>
            <div id="facilities-block"></div>
            <div id="purposes-block"></div>
          </section>

          <!-- Floor Plans (tabbed) -->
          <section class="pd-section" id="floorplans-section">
            <h2 class="pd-section-title">Floor Plans</h2>
            <div class="pd-floorplans" id="floorplans-body">
              <div class="pd-floorplans__tabs" id="floorplan-tabs"></div>
              <div class="pd-floorplans__image-wrap">
                <img
                  id="floorplan-active-img"
                  class="pd-floorplans__img"
                  src=""
                  alt="Floor plan"
                  loading="lazy" />
              </div>
            </div>
          </section>

          <!-- Masterplan -->
          <section class="pd-section" id="masterplan-section">
            <h2 class="pd-section-title">Masterplan</h2>
            <div class="pd-masterplan" id="masterplan-wrap">
              <img
                id="masterplan-img"
                class="pd-masterplan__img"
                src=""
                alt="Project masterplan"
                loading="lazy" />
              <button
                class="pd-masterplan__expand"
                id="masterplan-expand-btn"
                type="button">
                <i class="fa-solid fa-expand" aria-hidden="true"></i> View Full
                Masterplan
              </button>
            </div>
          </section>

          <!-- Location Map -->
          <section class="pd-section" id="map-section">
            <h2 class="pd-section-title">Location</h2>
            <div class="pd-map-row">
              <div id="property-map" class="pd-map"></div>
              <div class="pd-neighborhood" id="neighborhood-list"></div>
            </div>
          </section>
        </main>

        <!-- Sidebar -->
        <aside class="pd-sidebar" id="pd-sidebar">
          <div class="pd-contact-form-card" id="contact-form-card"></div>
        </aside>
      </div>
    </div>

    <!-- ── Similar Properties ──────────────────────────────────── -->
    <section class="pd-similar" id="similar-section">
      <div class="pd-similar__inner">
        <div class="pd-similar__header">
          <h2
            class="pd-section-title"
            style="margin-bottom: 0; border-bottom: none; padding-bottom: 0">
            Similar Properties
          </h2>
          <div class="pd-similar__nav">
            <button
              class="pd-similar__nav-btn"
              id="similar-prev"
              aria-label="Previous">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button
              class="pd-similar__nav-btn"
              id="similar-next"
              aria-label="Next">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>
        <div class="swiper pd-similar__swiper" id="similar-swiper">
          <div class="swiper-wrapper" id="similar-slides"></div>
        </div>
      </div>
    </section>

    <div id="modal-root"></div>
    <div id="footer-root"></div>

    <script
      type="module"
      src="../../../src/shared/components/navbar/Navbar.js"></script>
    <script
      type="module"
      src="../../../src/shared/components/footer/Footer.js"></script>
    <script
      type="module"
      src="../../../src/shared/components/modal/Modal.js"></script>
    <script
      type="module"
      src="property-details.js"></script>
  </body>
</html>
