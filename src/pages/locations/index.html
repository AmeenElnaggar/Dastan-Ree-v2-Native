<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locations — Dastan Real Estate</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../src/assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../../src/styles/variables.css?v=ff653729" />
    <link rel="stylesheet" href="../../../src/styles/global.css?v=dcb3a4ea" />
    <link rel="stylesheet" href="../../../src/styles/utilities.css?v=3dab98b6" />
    <link rel="stylesheet" href="../../../src/shared/components/navbar/navbar.css?v=9be797a8" />
    <link rel="stylesheet" href="../../../src/shared/components/footer/footer.css?v=f1bd47e4" />
    <link rel="stylesheet" href="../../../src/shared/components/filter-banner/filter-banner.css?v=048cc9a3" />
    <link rel="stylesheet" href="locations.css?v=90725ceb" />
    <script>
      history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../../tailwind.config.js"></script>
  </head>
  <body class="font-sans bg-white text-gray-900">
    <div id="navbar-root"></div>

    <!-- Page header (matches projects/properties style) -->
    <div id="page-header-root"></div>

    <!-- Cascading filter banner: Country → Region → City → Area -->
    <div id="filter-banner-root"></div>

    <!-- Listing -->
    <section class="locations-section">
      <div class="max-w-7xl mx-auto px-6">
        <div id="locationsGrid" class="locations-grid" role="list"></div>

        <nav
          id="locationsPagination"
          class="locations-pagination"
          aria-label="Locations pagination"
          hidden></nav>

        <div class="locations-empty" id="locationsEmpty" hidden>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <h3>No locations found</h3>
          <p>Try a different name or region.</p>
        </div>
      </div>
    </section>

    <div id="footer-root"></div>

    <script type="module" src="../../../src/shared/components/navbar/Navbar.js"></script>
    <script type="module" src="../../../src/shared/components/footer/Footer.js"></script>
    <script type="module" src="locations.js"></script>
  </body>
</html>
