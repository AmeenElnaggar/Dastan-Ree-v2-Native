<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details — Dastan Real Estate</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../src/assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link
      rel="stylesheet"
      href="../../../src/styles/variables.css?v=c71a22c9" />
    <link rel="stylesheet" href="../../../src/styles/global.css?v=204951af" />
    <link
      rel="stylesheet"
      href="../../../src/styles/utilities.css?v=3dab98b6" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/navbar/navbar.css?v=139a8091" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/footer/footer.css?v=c36d886e" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/modal/modal.css?v=4e68cea8" />
    <link
      rel="stylesheet"
      href="../../../src/shared/components/project-card/project-card.css?v=2463b508" />
    <link
      rel="stylesheet"
      href="../property-details/property-details.css?v=e6b77014" />
    <link rel="stylesheet" href="project-details.css?v=6b43a054" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../../tailwind.config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body class="font-sans bg-white text-gray-900">
    <div id="navbar-root"></div>

    <!-- ── Hero Slider (boxed, page-container width) ───────────────── -->
    <section class="pd-hero" id="pd-hero">
      <div class="pd-hero__inner">
        <div class="swiper pd-hero__swiper" id="gallery-main">
          <div class="swiper-wrapper" id="gallery-main-slides"></div>

          <button
            class="pd-hero__nav pd-hero__nav--prev"
            id="gallery-main-prev"
            type="button"
            aria-label="Previous image">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button
            class="pd-hero__nav pd-hero__nav--next"
            id="gallery-main-next"
            type="button"
            aria-label="Next image">
            <i class="fa-solid fa-chevron-right"></i>
          </button>

          <div class="pd-hero__pagination" aria-label="Slide pagination">
            <span class="pd-hero__page-current" id="hero-page-current">01</span>
            <span class="pd-hero__page-sep" aria-hidden="true">/</span>
            <span class="pd-hero__page-total" id="hero-page-total">01</span>
          </div>

          <button
            class="pd-hero__preview"
            id="gallery-main-preview"
            type="button"
            aria-label="Preview">
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
            <span>Preview</span>
          </button>

          <!-- Bottom content overlay (rendered by JS): badge, title, price, location -->
          <div
            class="pd-hero__overlay"
            id="hero-overlay"
            aria-hidden="false"></div>
        </div>
      </div>
    </section>

    <!-- ── Project Details ─────────────────────────────────────────── -->
    <section class="pd-overview" id="overview-section">
      <div class="pd-overview__inner">
        <h2 class="pd-section-title">Project Details</h2>
        <p class="pd-overview__desc" id="overview-desc"></p>
        <div class="pd-overview__price" id="overview-price"></div>
        <div class="pd-overview__stats" id="overview-stats"></div>
      </div>
    </section>

    <!-- ── Sticky Summary Bar ─────────────────────────────────────── -->
    <div
      class="prop-sticky-bar"
      id="propStickyBar"
      role="region"
      aria-label="Project summary"
      aria-hidden="true">
      <div class="prop-sticky-bar__inner">
        <div class="prop-sticky-bar__left">
          <div class="prop-sticky-bar__title-block">
            <div class="prop-sticky-bar__title-row">
              <span class="prop-sticky-bar__name" id="sticky-name"></span>
              <span
                class="prop-sticky-bar__badge"
                id="sticky-status"
                hidden></span>
              <span
                class="prop-sticky-bar__badge prop-sticky-bar__badge--featured"
                id="sticky-featured"
                hidden>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="9"
                  height="9">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
                Featured
              </span>
            </div>
            <div class="prop-sticky-bar__loc" id="sticky-location"></div>
          </div>
        </div>
        <div class="prop-sticky-bar__right">
          <div class="prop-sticky-bar__price-wrap">
            <span class="prop-sticky-bar__price" id="sticky-price"></span>
            <span
              class="prop-sticky-bar__price-sub"
              id="sticky-price-sub"></span>
          </div>
          <div class="prop-sticky-bar__icon-btns">
            <button
              class="prop-sticky-bar__icon-btn"
              id="stickyShareBtn"
              type="button"
              title="Share">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="15"
                height="15">
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
              </svg>
            </button>
            <button
              class="prop-sticky-bar__icon-btn"
              id="stickySaveBtn"
              type="button"
              title="Save">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="15"
                height="15">
                <path
                  d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="prop-sticky-bar__progress" id="stickyProgress"></div>
    </div>

    <!-- ── Body: Main Column + Sidebar ───────────────────────────── -->
    <div class="pd-body">
      <div class="pd-body__inner">
        <!-- Main Column -->
        <main class="pd-main-col">
          <!-- About -->
          <section class="pd-section" id="about-section">
            <h2 class="pd-section-title">About This Project</h2>
            <div class="pd-about-body">
              <div class="pd-about__main">
                <div class="pd-about__text is-clamped" id="about-text"></div>
                <button
                  class="pd-about__readmore"
                  id="about-readmore"
                  type="button"
                  aria-expanded="false"
                  hidden>
                  <span class="pd-about__readmore-label">Read More</span>
                  <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>
              </div>
              <div class="pd-developer-card" id="developer-card"></div>
            </div>
            <img class="pd-about-image" id="about-image" alt="" hidden />
          </section>

          <!-- Unit Types (HasMany) -->
          <section class="pd-section" id="unittypes-section" hidden>
            <h2 class="pd-section-title">Unit Types</h2>
            <div class="pd-unittypes" id="unittypes-grid"></div>
          </section>

          <!-- Floor Plans (fallback / tabbed) -->
          <section class="pd-section" id="floorplans-section">
            <h2 class="pd-section-title">Floor Plans</h2>
            <div class="pd-floorplans" id="floorplans-body">
              <div class="pd-floorplans__tabs" id="floorplan-tabs"></div>
              <div class="pd-floorplans__image-wrap">
                <img
                  id="floorplan-active-img"
                  class="pd-floorplans__img"
                  src=""
                  alt="Floor plan"
                  loading="lazy" />
              </div>
            </div>
          </section>

          <!-- Amenities & Features -->
          <section class="pd-section" id="amenities-section">
            <h2 class="pd-section-title">Amenities &amp; Features</h2>
            <div class="pd-amenities-grid" id="amenities-grid"></div>
            <div id="facilities-block"></div>
            <div id="purposes-block"></div>
            <div id="views-block"></div>
          </section>

          <!-- Sale & Payment -->
          <section class="pd-section" id="saleinfo-section" hidden>
            <h2 class="pd-section-title">Sale &amp; Payment</h2>
            <div class="pd-payment-summary" id="payment-summary"></div>
            <div id="finishing-block"></div>
            <div id="saletypes-block"></div>
            <div id="paymentmethods-block"></div>
          </section>

          <!-- Video Tour -->
          <section class="pd-section" id="video-section" hidden>
            <h2 class="pd-section-title">Video Tour</h2>
            <div class="pd-video" id="video-wrap"></div>
          </section>

          <!-- Masterplan -->
          <section class="pd-section" id="masterplan-section">
            <h2 class="pd-section-title">Masterplan</h2>
            <div class="pd-masterplan" id="masterplan-wrap">
              <img
                id="masterplan-img"
                class="pd-masterplan__img"
                src=""
                alt="Project masterplan"
                loading="lazy" />
              <button
                class="pd-masterplan__expand"
                id="masterplan-expand-btn"
                type="button">
                <i class="fa-solid fa-expand" aria-hidden="true"></i> View Full
                Masterplan
              </button>
            </div>
          </section>

          <!-- Location Map -->
          <section class="pd-section" id="map-section">
            <h2 class="pd-section-title">Location</h2>
            <div class="pd-map-row">
              <div id="project-map" class="pd-map"></div>
              <div class="pd-neighborhood" id="neighborhood-list"></div>
            </div>
          </section>
        </main>

        <!-- Sidebar -->
        <aside class="pd-sidebar" id="pd-sidebar">
          <div class="pd-contact-form-card" id="contact-form-card"></div>
        </aside>
      </div>
    </div>

    <!-- ── Similar Projects ──────────────────────────────────── -->
    <section class="pd-similar" id="similar-section">
      <div class="pd-similar__inner">
        <div class="pd-similar__header">
          <h2 class="pd-section-title">Similar Projects</h2>
          <div class="pd-similar__nav">
            <button
              class="pd-similar__nav-btn"
              id="similar-prev"
              aria-label="Previous">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button
              class="pd-similar__nav-btn"
              id="similar-next"
              aria-label="Next">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>
        <div class="swiper pd-similar__swiper" id="similar-swiper">
          <div class="swiper-wrapper" id="similar-slides"></div>
        </div>
      </div>
    </section>

    <div id="modal-root"></div>
    <div id="footer-root"></div>

    <script
      type="module"
      src="../../../src/shared/components/navbar/Navbar.js"></script>
    <script
      type="module"
      src="../../../src/shared/components/footer/Footer.js"></script>
    <script
      type="module"
      src="../../../src/shared/components/modal/Modal.js"></script>
    <script type="module" src="project-details.js"></script>
  </body>
</html>
