<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developers — Dastan Real Estate</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../../src/assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../../src/styles/variables.css" />
    <link rel="stylesheet" href="../../../src/styles/global.css" />
    <link rel="stylesheet" href="../../../src/styles/utilities.css" />
    <link rel="stylesheet" href="../../../src/shared/components/navbar/navbar.css" />
    <link rel="stylesheet" href="../../../src/shared/components/footer/footer.css" />
    <link rel="stylesheet" href="../../../src/shared/components/pagination/pagination.css" />
    <link rel="stylesheet" href="developers.css" />
    <script>
      history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../../tailwind.config.js"></script>
  </head>
  <body class="font-sans bg-white text-gray-900">
    <div id="navbar-root"></div>

    <!-- Hero -->
    <header class="developers-hero">
      <div class="developers-hero__bg" aria-hidden="true"></div>
      <div class="developers-hero__overlay" aria-hidden="true"></div>
      <div class="developers-hero__content max-w-7xl mx-auto px-6 text-center">
        <span class="developers-hero__eyebrow fade-up">Our Network</span>
        <h1 class="developers-hero__title fade-up" style="transition-delay: 0.1s">
          Trusted Real Estate Developers
        </h1>
        <p class="developers-hero__subtitle fade-up" style="transition-delay: 0.2s">
          Browse the developers we partner with — the architects behind the
          region's most coveted addresses.
        </p>
      </div>
    </header>

    <!-- Listing -->
    <section class="developers-section">
      <div class="max-w-7xl mx-auto px-6">
        <div class="developers-toolbar fade-up">
          <div class="developers-search">
            <svg
              class="developers-search__icon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              id="developersSearch"
              type="search"
              class="developers-search__input"
              placeholder="Search developers by name or location…"
              autocomplete="off"
              aria-label="Search developers" />
            <button
              id="developersSearchClear"
              class="developers-search__clear"
              type="button"
              aria-label="Clear search"
              hidden>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
          <span class="developers-count" id="developersCount"></span>
        </div>

        <div id="developersGrid" class="developers-grid" role="list"></div>

        <nav
          id="developersPagination"
          class="pagination"
          aria-label="Developers pagination"
          hidden></nav>

        <div class="developers-empty" id="developersEmpty" hidden>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <h3>No developers found</h3>
          <p>Try a different name or location.</p>
        </div>
      </div>
    </section>

    <div id="footer-root"></div>

    <script type="module" src="../../../src/shared/components/navbar/Navbar.js"></script>
    <script type="module" src="../../../src/shared/components/footer/Footer.js"></script>
    <script type="module" src="developers.js"></script>
  </body>
</html>
